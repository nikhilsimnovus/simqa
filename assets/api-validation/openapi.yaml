  /testcases/import:
    post:
      summary: Import one or more test cases from a file
      description: |
        **Synchronous operation**: Imports test cases and makes them immediately available.

        Upon receiving a 200 response, the imported test cases are guaranteed to be available via GET /v2/testcases/{id} without retry logic. The response includes the full details of each imported test case along with their generated IDs.

        **File format**: JSON file containing a single test case definition or an array of test case definitions.
      tags:
        - test-cases
      operationId: importTestCases
      requestBody:
        required: true
        description: Upload a file that contains test case definitions. When the file is JSON, its contents must match either `TestCaseImportPack` (preferred, matches export) or a single `TestCaseImportItem` object. Zip archives are also accepted and should contain one or more JSON files with `TestCaseImportItem` objects.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The file containing test cases (zip or json). For JSON files, the payload must match `TestCaseImportPack` or `TestCaseImportItem`.
      responses:
        '200':
          description: Test cases imported successfully. All imported test cases are immediately available via GET /v2/testcases/{id}.
          content:
            application/json:
              schema:
                type: object
                properties:
                  importedCount:
                    type: integer
                    description: Number of test cases successfully imported
                  testCases:
                    type: array
                    description: List of imported test cases with their generated IDs. Use the id field to retrieve via GET /v2/testcases/{id}.
                    items:
                      $ref: '#/components/schemas/TestCase'
        '400':
          description: Invalid request - required fields missing or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                testNameRequired:
                  summary: Test_Name is required
                  value:
                    code: INVALID_REQUEST
                    message: Test_Name is required
                testNameNonEmpty:
                  summary: Test_Name must be a non-empty string
                  value:
                    code: INVALID_REQUEST
                    message: Test_Name must be a non-empty string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
