        rfCards:
          type: array
          description: Every RF device of the box, by device number. The simulators on the box are in /simulators (nodes.hostId); one whose simulatorMode is not the box's installMode is left over from the box's earlier install and stays until deleted.
          items:
            $ref: '#/components/schemas/RFCard'
    HostNode:
      type: object
      required:
        - role
        - ipAddress
        - agentConnected
        - machine
      properties:
        role:
          type: string
          enum:
            - ue
            - app-server
          description: What this machine is to the host
          example: ue
        ipAddress:
          type: string
          example: 192.168.1.64
        agentConnected:
          type: boolean
          description: Whether the machine's agent is connected right now. The app-server has no agent yet, so it is false there.
          example: true
        machine:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Machine'
          description: What the machine is, as its agent reported. Null until it has reported.
    Machine:
      type: object
      properties:
        installMode:
          type: string
          enum:
            - regular
            - container
          description: How the box runs, as its agent reported it - container when it runs the container-manager, regular when it runs one UE stack of its own. One Simnovator serves boxes of both kinds; a box reinstalled the other way reports its new mode on the next connection.
          example: container
        hardware:
          type: object
          description: CPUs, NUMA layout (node number to CPU list), memory in MB
          example:
            cpus: 64
            numa:
              '0':
                - 0
                - 1
                - 2
                - 3
              '1':
                - 4
                - 5
                - 6
                - 7
            memory_mb: 64206
        software:
          type: object
          description: OS, kernel and agent version
          example:
            os: Ubuntu 24.04.2 LTS
            kernel: 6.8.0-53-generic
            agent_version: v2.1.0
        lastSeen:
          type: string
          format: date-time
          description: When the box last reported
          example: '2026-09-18T09:02:11Z'
    RFCard:
      type: object
      properties:
        device:
          type: integer
          description: The N of /dev/sdrN on the host
          example: 0
        serial:
          type: string
          description: Board serial; a board's master and slave share it
          example: '202201001240'
        role:
          type: string
          enum:
            - master
            - slave
          example: master
        board:
          type: string
          example: SDR100
        fpgaVersion:
          type: string
          example: '2026-06-26'
        softwareVersion:
          type: string
          example: '2026-07-02'
        present:
          type: boolean
          description: False when the box stopped reporting this device; the record is kept so a held card can be shown as missing
          example: true
        lastSeen:
          type: string
          format: date-time
          example: '2026-09-18T09:02:12Z'
        simulatorId:
          type: integer
          nullable: true
          description: The simulator holding this device; null while it is free
          example: 12
        holder:
          type: string
          nullable: true
          description: Name of the simulator holding this device; null while it is free
          example: UE-Sim-1
        holderBusy:
          type: boolean
          description: The holder is running a test, so the device cannot be taken from it right now
          example: false
    UpdateHostRequest:
      type: object
      required:
        - rfAllocation
      properties:
        rfAllocation:
          type: string
          enum:
            - board
            - device
          description: What one unit of RF allocation is on this host. Container installations only.
          example: device
    SimulatorNodes:
      type: object
      description: Where and how the simulator runs.
      required:
        - ipaddress
        - simulatorMode
        - hostId
        - rfCards
        - rfCardsAbsent
      properties:
        ipaddress:
          type: string
          example: 192.168.1.64
        assignedUsers:
          type: array
          description: Users assigned to the simulator; present for an admin only
          items:
            type: object
            properties:
              userId:
                type: string
              username:
                type: string
              assignedBy:
                type: string
              isDefault:
                type: boolean
                description: This simulator is the user's default
        ueSimPort:
          type: integer
          nullable: true
          description: UE simulator port on the host; set for container simulators
          example: 9001
        appManagerPort:
          type: integer
          nullable: true
          description: App-manager port on the host; set for container simulators
          example: 8081
        simulatorMode:
          type: string
          enum:
            - regular
            - container
          description: regular = the whole host, one simulator; container = one slot of the host
          example: container
        hostId:
          type: integer
          description: The host the simulator runs on
          example: 4
        slot:
          type: integer
          nullable: true
          description: Slot on the host; set for container simulators
          example: 2
        rfCards:
          type: array
          items:
            type: integer
          description: RF devices the simulator holds (the N of /dev/sdrN on the host). A regular simulator holds every device of its host; a container UE simulator gets one free board, or device, when created and can be changed with PATCH rfCards; an ORU simulator holds none.
          example:
            - 2
            - 3
        rfCardsAbsent:
          type: array
          items:
            type: integer
          description: The devices among rfCards the host no longer reports (removed or failed since they were assigned)
          example: []
    LogSettings-2:
      type: object
      required:
        - id
        - name
        - layers
      properties:
        id:
          type: string
          format: uuid
          description: Unique UUID of the log setting profile
          example: 019e961a-49c3-7267-b174-2fb741a80d2e
        name:
          type: string
          maxLength: 20
          description: Name of the log setting (maximum 20 characters)
          example: Standard Debug
        layers:
          $ref: '#/components/schemas/LogLayers'
        savePhySignals:
          type: boolean
          description: Flag to save physical layer signals
          example: false
        displayEncryptedPayload:
          type: boolean
          description: Flag to display encrypted payload
          example: false
        displaySecurityKey:
          type: boolean
          description: Flag to display security key
          example: false
    LogSettingInput-2:
      type: object
      required:
        - name
        - layers
      properties:
        name:
          type: string
          maxLength: 20
          description: Name of the log setting profile (maximum 20 characters)
          example: custom_debug
        layers:
          $ref: '#/components/schemas/LogLayers'
        savePhySignals:
          type: boolean
          description: Flag to save physical layer signals
          example: false
        displayEncryptedPayload:
          type: boolean
          description: Flag to display encrypted payload
          example: false
        displaySecurityKey:
          type: boolean
          description: Flag to display security key
          example: false
