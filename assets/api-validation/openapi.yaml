  /testcases:
    get:
      summary: List all test cases
      tags:
        - test-cases
      operationId: getAllTestCases
      parameters:
        - in: query
          name: pageSize
          description: Maximum number of items to return per page. Must be a positive integer between 1 and 1000. Defaults to 50 when omitted. Requests exceeding 1000 will return 400 Bad Request.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
        - in: query
          name: pageNumber
          description: 1-indexed page number for pagination. Defaults to 1.
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        '200':
          description: List of test cases retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Bulk delete test cases by scope
      description: Schedules an asynchronous job that deletes all execution stats, logs, and test-processor state associated with the test cases.
      tags:
        - test-cases
      operationId: deleteTestCases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scope
              properties:
                scope:
                  type: string
                  enum:
                    - single
                    - multiple
                    - all
                    - filtered
                  description: The scope of deletion
                  example: multiple
                testCaseIds:
                  type: array
                  items:
                    type: string
                  description: List of test case UUIDs to delete (required for single and multiple scopes)
                  example:
                    - e4e040aa-fbcd-492f-b44c-473d09a473da
                    - e4e040aa-fbcd-492f-b44c-473d09a473db
                filter:
                  type: object
                  description: Rules/filters to target specific test cases for deletion (required for filtered scope)
                  example:
                    field: test_name
                    operator: contains
                    value: perf
      responses:
        '200':
          description: Test case(s) queued for deletion successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
                  message:
                    type: string
                    example: Test case(s) queued for deletion
        '206':
          description: Partial success - some test cases failed to delete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Some testcases failed to delete
                  failed:
                    type: array
                    items:
                      type: string
                    example:
                      - test_case_1
        '400':
          description: Invalid request body, scope, or filter format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Conflict - some test cases are in progress and cannot be deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Some testcases could not be deleted because they are in progress
                  conflict:
                    type: array
                    items:
                      type: string
                    example:
                      - test_case_in_progress
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Bad Gateway - executor or creator service communication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /testcases/{testCaseId}:
    get:
      summary: Get details of a specific test case
      tags:
        - test-cases
      operationId: getTestCaseDetails
      parameters:
        - in: path
          name: testCaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test case details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TestCase'
                  - type: object
                    required:
                      - testDefinition
                    properties:
                      testDefinition:
                        type: object
                        description: Test case definition (test steps, parameters, etc.)
                        additionalProperties: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Test case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update tags of a specific test case
      description: Updates the user-defined tags for a test case.
      tags:
        - test-cases
      operationId: updateTestCaseTags
      parameters:
        - in: path
          name: testCaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_tags:
                  type: array
                  items:
                    type: string
                  description: List of user-defined tags to assign to the test case
                  example:
                    - sanity
                    - regression
      responses:
        '200':
          description: Test case tags updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Test case updated successfully
        '400':
          description: Invalid request body or testCaseId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a specific test case
      description: Schedules an asynchronous job that deletes all execution stats, logs, and test-processor state associated with the test case.
      tags:
        - test-cases
      operationId: deleteTestCase
      parameters:
        - in: path
          name: testCaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test case deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Test case deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Test case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Test case is in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Failed to delete testcase
                  error:
                    type: string
                    example: Test case is in progress
        '500':
          $ref: '#/components/responses/InternalServerError'
  /testcases/{testCaseId}/history:
    delete:
      summary: Purge all execution history for a test case
      description: |
        Schedules an asynchronous job that deletes all execution stats, logs, and test-processor state associated with this test case. The test case definition and its configuration in test-creator are **not** removed — the test case itself remains fully usable after the purge. Returns HTTP 202 Accepted immediately; use the returned `jobId` with `GET /api/jobs/{id}` to track completion.
      tags:
        - test-cases
      operationId: purgeTestCaseHistory
      parameters:
        - in: path
          name: testCaseId
          required: true
          schema:
            type: string
          description: Unique identifier of the test case whose history should be purged
      responses:
        '202':
          description: History purge job accepted and scheduled
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - status
                  - jobId
                  - type
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: accepted
                  jobId:
                    type: string
                    format: uuid
                    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  type:
                    type: string
                    example: DELETE_TESTCASE
                  message:
                    type: string
                    example: History purge for testcase 'my-test' scheduled
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Test case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Test case execution is in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cannot purge history while test is in progress
        '500':
          $ref: '#/components/responses/InternalServerError'
  /testcases/search:
    post:
      summary: Search and filter test cases with advanced capabilities
      description: |
        Search and retrieve test cases with support for filtering, sorting, pagination, and optional grouping. Returns test cases with their execution history and metadata.
      tags:
        - test-cases
      operationId: searchTestCases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTestCasesRequest'
            examples:
              basicSearch:
                summary: Basic search with pagination and sorting
                value:
                  pageNumber: 1
                  pageSize: 50
                  sortParameter: execution_start_time
                  sortOrder: DESC
              filteredSearch:
                summary: Search with filter
                value:
                  pageNumber: 1
                  pageSize: 50
                  sortParameter: execution_status
                  sortOrder: DESC
                  filter: |
                    { "field": "execution_status", "operator": "=", "value": "Completed" }
              groupedSearch:
                summary: Search with grouping by status
                value:
                  groupBy: execution_status
                  pageNumber: 1
                  pageSize: 1000
                  sortOrder: DESC
                  sortParameter: execution_start_time
      responses:
        '200':
          description: Test cases retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseListResponse'
        '400':
          description: Invalid request - bad filter syntax, invalid sort field, or invalid pagination params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
