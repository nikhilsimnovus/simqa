    delete:
      summary: Delete a simulator (admin only)
      description: Deletes a simulator and its associated test case history using the simulator ID. This is an admin-only operation. A container simulator's UE container is removed first through the box's container-manager; while that agent is not connected the records are deleted anyway (logged) and whatever still runs on the box is cleaned up there. A container the manager cannot remove keeps the simulator (409).
