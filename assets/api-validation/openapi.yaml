    put:
      summary: Update a network topology diagram
      description: |
        Administrators only. The id in the body selects the diagram to update. Fields omitted from the payload keep their stored values, so a request that carries no viewers leaves the existing grants untouched.
      tags:
        - tools
      operationId: updateNetworkTopologyDiagram
      requestBody:
        description: The diagram to update. id is required.
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NetworkTopologyDiagramInput'
                - type: object
                  required:
                    - id
                  properties:
                    id:
                      type: integer
                      description: Identifier of the diagram to update
                      example: 1
      responses:
        '200':
          description: Diagram updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkTopologyDiagram'
        '400':
          description: Invalid payload, or name longer than 100 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: Diagram name must be 100 characters or fewer
                details: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: A diagram with the same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CONFLICT
                message: Diagram name already exists
                details: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a network topology diagram
      description: Administrators only.
      tags:
        - tools
      operationId: deleteNetworkTopologyDiagram
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
          description: Identifier of the diagram to delete
          example: 1
      responses:
        '200':
          description: Diagram deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: topology deleted successfully
        '400':
          description: The id parameter is missing or is not a number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: id parameter is required
                details: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No diagram exists with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: topology not found
                details: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
