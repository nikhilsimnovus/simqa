    SearchTestCasesRequest:
      type: object
      description: Request to search, filter, and group test cases
      properties:
        pageNumber:
          type: integer
          description: 1-indexed page number. Defaults to 1 if not provided or less than 1.
          example: 1
          minimum: 1
        pageSize:
          type: integer
          description: Maximum number of results to return per page. Defaults to 50 if not provided or less than 1. Maximum allowed value is 1000; exceeding this returns 400 Bad Request.
          example: 50
          minimum: 1
          maximum: 1000
        sortParameter:
          type: string
          description: Field to sort by. Defaults to "execution_start_time".
          enum:
            - test_name
            - date_modified
            - execution_status
            - execution_result
            - completed_duration
            - simulator_name
            - execution_start_time
            - test_duration
          default: execution_start_time
        sortOrder:
          type: string
          description: Sort order direction. Defaults to "DESC".
          enum:
            - ASC
            - DESC
          default: DESC
        filter:
          type: object
          description: |
            AST-based filter object for advanced filtering. Supports logical operators and multiple filter conditions. Allowed filter fields: - execution_status: "In Progress", "Completed", "Stopped", "Aborted", "Not Executed" - simulator_name: any simulator name - test_name: any test case name - date_modified: date-based filtering - execution_result: any result value - completed_duration: duration filtering - execution_start_time: timestamp filtering - test_duration: duration filtering
          example:
            field: execution_status
            op: In
            value:
              - Completed
              - Stopped
        groupBy:
          type: string
          description: |
            Group results by field value. When specified, items array will be empty and results will be in the groups object instead. Allowed values: "status", "verdict", "result", "simulator"
          enum:
            - status
            - verdict
            - result
            - simulator
    StartTestExecutionRequest:
      type: object
      description: Request to start execution of a test case
      properties:
        simulatorId:
          type: string
          description: |
            Simulator on which the test should be executed. If not provided: If only one simulator exists, it will be used. If multiple simulators exist, the default simulator will be used.
        executionParameters:
          type: object
          description: Optional runtime parameters for execution
          additionalProperties: true
    ExecutionHistoryItem:
      type: object
      required:
        - status
        - simulatorName
        - startTime
        - endTime
        - startTimeUnix
        - endTimeUnix
        - iterationId
      properties:
        status:
          type: string
          enum:
            - COMPLETED
            - IN_PROGRESS
            - NOT_EXECUTED
            - ABORTED
          description: Execution status
        result:
          type: string
          description: Final execution result (Success/Fail/etc.)
          example: Pass
        executionResultDetails:
          type: string
          description: Additional details about the execution result
          example: Test case execution completed successfully.
        simulatorName:
          type: string
          description: Name of the simulator where the test was executed
          example: simulator2
        startTime:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp when execution started
          example: '2026-09-24T05:02:31Z'
        endTime:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp when execution ended
          example: '2026-09-24T05:03:50Z'
        startTimeUnix:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when execution started
          example: 1770840126
        endTimeUnix:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when execution ended
          example: 1770840198
        iterationId:
          type: string
          description: Unique identifier of the test execution
          example: 003d78d4-eb68-40b7-958c-9b70020ab02b
    TestExecutionResult:
      type: object
      required:
        - executionId
        - simulatorId
        - status
        - executedOn
        - durationSeconds
      properties:
        executionId:
          type: string
        simulatorId:
          type: string
          description: Unique identifier of the test execution
          example: exec-9f21a
        simulatorName:
          type: string
          description: Simulator where the test was executed
          example: sim-1
        status:
          type: string
          enum:
            - COMPLETED
