                    appManagerPort: 8081
                    simulatorMode: container
                    hostId: 4
                    slot: 2
                    rfCards:
                      - 2
                      - 3
                    rfCardsAbsent: []
        '400':
          description: Invalid request, invalid simulator type (must be ORU or UE), or rfCards on a simulator that is not a container UE simulator or naming a device that is not on the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
