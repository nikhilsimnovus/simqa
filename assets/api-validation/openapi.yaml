      summary: Create a new saved filter
      description: Saves a filter configuration under a given name and table key for the authenticated user.
      tags:
        - saved-filters
      operationId: createSavedFilter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFilterCreateInput'
      responses:
        '200':
          description: Filter saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
