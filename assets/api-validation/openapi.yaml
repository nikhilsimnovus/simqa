          type: string
        Test_Name:
          type: string
        Test_Description:
          type: string
        Pass_Fail_Criteria_Id:
          type: string
          format: uuid
        Log_Settings_Id:
          type: string
          format: uuid
        Creator_Id:
          type: string
        Modifier_Id:
          type: string
        State:
          type: string
        Test_Config_Intermediate_Object:
          type: object
          additionalProperties: true
        Config_File:
          type: object
          additionalProperties: true
        Type:
          type: string
        Created_Date:
          type: string
        Modified_Date:
          type: string
        Deleted_Date:
          type: string
    PageInfo:
      type: object
      required:
        - page
        - totalItems
      properties:
        page:
          type: integer
        totalItems:
          type: integer
    FrequencyRange:
      type: object
      required:
        - low
        - centre
        - high
      properties:
        low:
          type: number
          format: double
          description: Lowest frequency in MHz
        centre:
          type: number
          format: double
          description: Centre frequency in MHz
        high:
          type: number
          format: double
          description: Highest frequency in MHz
    SCSBandwidthCombination:
      type: object
      required:
        - scs
        - bandwidths
      properties:
        scs:
          type: integer
          description: Subcarrier spacing in kHz. For LTE, this can be 0.
          example: 15
        bandwidths:
          type: array
          items:
            type: integer
          description: Supported channel bandwidths in MHz
          example:
            - 5
            - 10
            - 20
    BandInfoRequest:
      type: object
      required:
        - rat
      properties:
        rat:
          type: string
          enum:
            - NR
            - LTE
          example: NR
        band:
          type: string
          description: Optional exact band lookup (e.g., n78, 3)
          example: n78
        search:
          type: string
          description: Search text over `band` and `bandName`
          example: n7
        mode:
          type: array
          items:
            type: string
            enum:
              - FDD
              - TDD
          description: Multi-select mode filter (OR)
        geoArea:
          type: array
          items:
            type: string
          description: Multi-select geographic area filter (OR)
        release:
          type: array
          items:
            type: string
          description: Multi-select 3GPP release filter (OR)
        supportedBandwidth:
          type: array
          items:
            type: string
          description: Multi-select supported channel bandwidth filter in MHz (OR)
          example:
            - '5'
            - '10'
            - '20'
        sortBy:
          type: string
          enum:
            - band
            - bandName
            - mode
            - geoArea
            - release
          example: band
        sortOrder:
          type: string
          enum:
            - asc
            - desc
          default: asc
          example: asc
    BandData:
      type: object
      required:
        - band
        - bandName
        - mode
        - dlFreqRange
        - ulFreqRange
      properties:
        band:
          type: string
          description: Band identifier (e.g., n1 for NR, 1 for LTE)
          example: n1
        bandName:
          type: string
          description: Human-readable band name
          example: n1
        mode:
          type: string
          description: Duplexing mode
          enum:
            - FDD
            - TDD
          example: FDD
        dlFreqRange:
          allOf:
            - $ref: '#/components/schemas/FrequencyRange'
          description: Downlink frequency range
        ulFreqRange:
          allOf:
            - $ref: '#/components/schemas/FrequencyRange'
          description: Uplink frequency range
        geoArea:
          type: string
          description: Geographic area where the band is used
          example: Europe
        release:
          type: string
          description: 3GPP release version
          example: '15'
        scs:
          type: array
          items:
            type: integer
          description: Supported subcarrier spacing values in kHz
          example:
            - 15
            - 30
        scsBandwidthCombination:
          type: array
          items:
            $ref: '#/components/schemas/SCSBandwidthCombination'
          description: Supported bandwidth values grouped by SCS
    BandInfoResponse:
      type: object
      required:
        - code
        - data
      properties:
        code:
          type: integer
          description: Response code (200 for success)
          example: 200
        message:
          type: string
          description: Optional response message
        data:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/BandData'
            - $ref: '#/components/schemas/BandData'
          description: Band information payload (array for list response, object for exact band lookup)
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Expiration time in seconds
        roles:
          type: array
          items:
            type: string
          description: List of user roles included in the token
    UserInfo:
      type: object
      required:
        - username
        - roles
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          description: User unique identifier
        username:
          type: string
          example: johndoe
          description: User login name
        first_name:
          type: string
          example: John
          description: User first name
        last_name:
          type: string
          example: Doe
          description: User last name
        email:
          type: string
          format: email
          example: john.doe@example.com
        roles:
          type: array
          items:
            type: string
          example:
            - admin
          description: List of roles assigned to the user
        last_active:
          type: string
          format: date-time
          description: ISO 8601 timestamp of last user activity
          example: '2026-04-10T09:30:00Z'
        date_created:
          type: string
          format: date-time
          description: ISO 8601 timestamp of user creation
          example: '2026-01-25T10:00:00Z'
        simulators:
          type: array
          items:
            $ref: '#/components/schemas/SimulatorMappingInfo'
    SimulatorMappingInfo:
      type: object
      required:
        - simulatorId
        - simulatorName
      properties:
        simulatorId:
          type: string
          example: '1'
        simulatorName:
          type: string
          example: UE-Sim-1
    CreateUserRequest:
      type: object
      required:
        - username
        - first_name
      properties:
        username:
          type: string
          description: User login name
          example: johndoe
        password:
          type: string
          description: Initial password for the user. Defaults to 'simnovus' if not provided
          example: P@ssw0rd!
        email:
          type: string
          format: email
          description: User email address (optional)
        first_name:
          type: string
          description: User first name
          example: John
        last_name:
          type: string
          description: User last name (optional)
          example: Doe
        role:
          type: string
          enum:
            - admin
            - user
          example: user
          default: user
          description: Role to assign to the user
    UpdatePasswordRequest:
      type: object
      required:
        - username
        - current_password
        - new_password
      properties:
        username:
          type: string
          description: Username
        current_password:
          type: string
          description: Current password
        new_password:
          type: string
          description: New password to set
    ResetPasswordRequest:
      type: object
      properties:
        new_password:
          type: string
          description: New temporary password to set for the user. If not provided, defaults to "simnovus"
    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          description: User first name (optional)
          example: John
        last_name:
          type: string
          description: User last name (optional)
          example: Doe
        email:
          type: string
          format: email
          description: User email address (optional)
          example: john@example.com
    SearchUsersRequest:
      type: object
      properties:
        filter:
          oneOf:
            - type: object
              description: Empty object for no filter
              example: {}
            - $ref: '#/components/schemas/FilterNode'
          description: Filter criteria using AST-based syntax. Empty object means no filtering.
        pageNumber:
          type: integer
          description: 1-indexed page number (default 1)
          example: 1
          minimum: 1
        pageSize:
          type: integer
          description: Maximum number of items to return per page (default 20)
          example: 20
          minimum: 1
          maximum: 1000
        sort_parameter:
          type: string
          description: Field to sort by (default "username"). Supported fields - username, email, firstName, lastName
          example: username
        sort_order:
          type: string
          enum:
            - ASC
            - DESC
          description: Sort order (default ASC)
          example: ASC
    SearchUsersResponse:
      type: object
      required:
        - users
        - total
        - total_pages
        - page_info
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserInfo'
          description: List of users matching the search criteria
        total:
          type: integer
          description: Total number of users matching the filter criteria (across all pages)
          example: 45
        total_pages:
          type: integer
          description: Total number of pages for pagination
          example: 3
        page_info:
          $ref: '#/components/schemas/PageInfo'
          description: Pagination metadata for current page
        message:
          type: string
          description: Optional response message
          example: Successfully retrieved users
        PageInfo:
          type: object
          required:
            - page
            - total_items
          properties:
            page:
              type: integer
              description: Current page number (1-based index)
              example: 1
            total_items:
              type: integer
              description: Number of items in the current page
              example: 20
    FilterNode:
      oneOf:
        - type: object
          description: Logical AND/OR node
          required:
            - op
            - conditions
          properties:
            op:
              type: string
              enum:
                - AND
                - OR
              description: Logical operator
            conditions:
              type: array
              items:
                $ref: '#/components/schemas/FilterNode'
              description: Sub-conditions to apply
        - type: object
          description: Filter leaf node (single condition)
          required:
            - field
            - operator
            - value
          properties:
            field:
              type: string
              enum:
                - username
                - email
                - firstName
                - lastName
                - roles
              description: Field to filter on
            operator:
              type: string
              enum:
                - '='
                - '!='
                - contains
                - starts_with
              description: Comparison operator
            value:
              description: Value to compare against
    CreateSimulatorRequest:
      type: object
      required:
        - simulatorName
        - ipAddress
      properties:
        simulatorName:
          type: string
          description: Name of the simulator to create
          example: UE-Sim-1
        ipAddress:
          type: string
          description: IP address of the simulator
          example: 192.168.1.64
        type:
          type: string
          enum:
            - ORU
            - UE
          description: Simulator type. Defaults to "UE" if not provided.
          example: UE
          default: UE
        simulatorMode:
          type: string
          enum:
            - regular
            - container
          description: Defaults to what the box runs - container when its container-manager is connected, regular otherwise. A regular simulator on a box that runs containers is refused (400); a container on a box that runs none is refused (409).
          example: container
        rfCards:
          type: array
          items:
            type: integer
          description: 'Container UE simulators only: the RF devices (the N of /dev/sdrN on the host) the simulator holds from the start, as one consecutive range (2, 3 - never 0, 3). Each must be present and free; under the host''s board allocation a board goes whole. Left out, the first free board (or device) is taken. Empty is refused.'
          example:
            - 2
            - 3
    UpdateSimulatorRequest:
      type: object
      properties:
        simulatorName:
          type: string
          description: Updated simulator name
          example: Updated-Sim-Name
        ipAddress:
          type: string
          description: Updated IP address
          example: 192.168.1.100
        type:
          type: string
          enum:
            - ORU
            - UE
          description: Updated simulator type (must be ORU or UE)
          example: ORU
        rfCards:
          type: array
          items:
            type: integer
          description: RF devices (the N of /dev/sdrN on the host) this simulator holds, as the complete new list; an empty list releases all of them. Container UE simulators only, and only while no test runs on the simulator. The devices run consecutively (2, 3 - never 0, 3); each must be on the host, present, and free or already held by this simulator; a host that allocates whole boards takes a board's master and slave together.
          example:
            - 2
            - 3
    SuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
          description: Optional response data
    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred
        error:
          type: string
          description: Optional error details
