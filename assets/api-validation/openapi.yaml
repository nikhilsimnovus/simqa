        - tools
      operationId: getSatelliteMetrics
      requestBody:
        description: Input parameters for satellite tracking metrics
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sLat
                - sLon
                - sAlt
                - sVel
                - gLat
                - gLon
              properties:
                sLat:
                  type: number
                  format: float
                  title: Satellite Latitude
                  description: Latitude of the satellite in degrees (-90 to 90)
                sLon:
                  type: number
                  format: float
                  title: Satellite Longitude
                  description: Longitude of the satellite in degrees (-180 to 180)
                sAlt:
                  type: number
                  format: float
                  title: Satellite Altitude
                  description: Altitude of the satellite in kilometers (km)
                sVel:
                  type: number
                  format: float
                  title: Satellite Velocity
                  description: Orbital velocity of the satellite in km/s
                gLat:
                  type: number
                  format: float
                  title: Ground Station Latitude
                  description: Latitude of the ground station in degrees (-90 to 90)
                gLon:
                  type: number
                  format: float
                  title: Ground Station Longitude
                  description: Longitude of the ground station in degrees (-180 to 180)
                ueLat:
                  type: number
                  format: float
                  title: User Equipment Latitude
                  description: Latitude of the User Equipment (UE) in degrees (optional)
                ueLon:
                  type: number
                  format: float
                  title: User Equipment Longitude
                  description: Longitude of the User Equipment (UE) in degrees (optional)
      responses:
        '200':
          description: Satellite metrics calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SatelliteMetrics'
