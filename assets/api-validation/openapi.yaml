    Job:
      type: object
      description: Represents an async background job in the Simnovator job queue
      required:
        - id
        - type
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique job identifier
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type:
          type: string
          description: Job type identifier
          enum:
            - DELETE_TESTCASE
            - STOP_TESTCASE
            - AUTOSAVE_CLEANUP
            - TEST_EXECUTION
          example: DELETE_TESTCASE
        status:
          type: string
          description: Current job status
          enum:
            - pending
            - running
            - success
            - failed
          example: running
        stage:
          type: string
          description: 'Current crash-resume stage within the job. For DELETE_TESTCASE jobs the stages progress as: (empty) → stats_deleted → processor_cleaned → logs_cleaned → done.'
          example: stats_deleted
        progress:
          type: integer
          description: Completion percentage (0–100)
          minimum: 0
          maximum: 100
          example: 33
        message:
          type: string
          description: Human-readable status message
          example: deleting processor data
        error:
          type: string
          description: Error detail if the job failed; empty string otherwise
          example: ''
        retry_count:
          type: integer
          description: Number of times the job has been retried
          example: 0
        payload:
          type: object
          description: Input parameters the job was created with
          example:
            testcase_name: my-test-001
            delete_from_test_creator: true
        result:
          type: object
          description: Output produced by the job on completion
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          description: When the job was enqueued
          example: '2026-05-12T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: Last time the job record was modified
          example: '2026-05-12T10:00:45Z'
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the job was first picked up by a worker
          example: '2026-05-12T10:00:05Z'
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the job reached a terminal state (success or failed)
          example: null
    JobListResponse:
      type: object
      required:
