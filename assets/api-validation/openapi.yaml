        id:
          type: string
          description: Unique identifier of the simulator
          example: '4'
        name:
          type: string
          description: Human-readable simulator name
          example: simulator-1
        type:
          type: string
          enum:
            - UE
            - ORU
          example: UE
        isDefault:
          type: boolean
          description: Whether this simulator is the default one
          example: true
        status:
          $ref: '#/components/schemas/SimulatorStatus'
    SimulatorStatus:
      type: object
      required:
        - availability
        - connectivity
        - stability
      properties:
        availability:
          type: string
          enum:
            - AVAILABLE
            - BUSY
          description: |
            The simulator is marked as AVAILABLE only when software and licenses are successfully installed on all associated nodes.
        connectivity:
          type: string
          enum:
            - CONNECTED
            - DISCONNECTED
        stability:
          type: string
          enum:
            - STABLE
            - UNSTABLE
          description: |
            The simulator is marked as STABLE only when software and licenses are successfully installed on all associated nodes.
    SimulatorRuntimeStatus:
      type: object
      required:
        - simulatorId
        - connectivity
        - stability
        - availability
        - lastUpdated
      properties:
        simulatorId:
          type: string
          example: '1'
        connectivity:
          type: string
          enum:
            - CONNECTED
            - DISCONNECTED
          example: CONNECTED
        stability:
          type: string
          enum:
            - STABLE
            - UNSTABLE
          example: STABLE
        availability:
          type: string
          enum:
            - AVAILABLE
            - BUSY
          example: AVAILABLE
        type:
          type: string
          enum:
            - UE
            - ORU
          example: UE
        usedBy:
          type: string
          nullable: true
          description: Information about the user currently using the simulator
          example: In use by johndoe
        isDefault:
          type: boolean
          description: Whether this is the caller's default simulator — the one a test starts on, and tools address, when the request names none. A user's first assigned simulator; when that assignment goes, the oldest remaining one. Present for a user only.
          example: true
        currentExecutionId:
          type: string
          nullable: true
          description: Unique identifier of the ongoing test execution (only present if status is BUSY)
          example: exec-9f21a
        testCaseId:
          type: string
          nullable: true
          description: Identifier of the test case currently being executed
          example: TC-101
        lastUpdated:
          type: string
          format: date-time
          description: Timestamp when the status was last refreshed
          example: '2026-01-25T09:30:00Z'
        nodes:
          $ref: '#/components/schemas/SimulatorNodes'
    SimulatorLicense:
      type: object
      required:
        - simulatorId
        - licenseType
        - licenseDetails
        - validity
        - features
      properties:
        simulatorId:
          type: string
          example: '1'
        licenseType:
          type: string
          enum:
            - FIXED
            - DONGLE
            - SERVER
          example: FIXED
        licenseDetails:
          $ref: '#/components/schemas/LicenseDetails'
        validity:
          $ref: '#/components/schemas/LicenseValidity'
        features:
          $ref: '#/components/schemas/LicensedFeatures'
    LicenseDetails:
      type: object
      discriminator:
        propertyName: licenseType
        mapping:
          dongle: '#/components/schemas/FixedOrDongleLicense'
          floating: '#/components/schemas/ServerLicense'
      oneOf:
        - $ref: '#/components/schemas/FixedOrDongleLicense'
        - $ref: '#/components/schemas/ServerLicense'
    FixedOrDongleLicense:
      type: object
      required:
        - id
        - licenseType
      properties:
        licenseType:
          type: string
          enum:
            - dongle
        id:
          type: string
          description: License identifier
          pattern: ^[a-f0-9]{2}(-[a-f0-9]{2}){5}$
          example: a0-b1-c0-3d-6e-ff
    ServerLicense:
      type: object
      required:
        - ipAddress
        - tag
        - licenseType
      properties:
        licenseType:
          type: string
          enum:
            - floating
        ipAddress:
          type: string
          description: License server IP address (IPv4 or IPv6)
          example: 192.168.10.20
        tag:
          type: string
          description: License grouping tag
          example: ue-ran
    LicenseValidity:
      type: object
      required:
        - endDate
        - status
      properties:
        endDate:
          type: string
          format: date
          example: '2026-01-01'
        status:
          type: string
          enum:
            - VALID
            - EXPIRED
            - EXPIRING_SOON
          example: VALID
    LicensedFeatures:
      type: object
      description: Licensed capabilities
      properties:
        rat:
          type: array
          description: Licensed Radio Access Technologies
          items:
            type: string
            enum:
              - NR
              - LTE
          minItems: 1
          uniqueItems: true
          example:
            - NR
            - LTE
        ueCount:
          type: integer
          description: Maximum number of UEs supported
          enum:
            - 1
            - 32
            - 64
            - 128
            - 256
            - 512
            - 1024
            - 5000
          example: 128
        cellCount:
          type: integer
          description: Number of supported cells
          minimum: 1
          maximum: 4
          example: 4
        ntn:
          type: boolean
          description: NTN support enabled
          example: true
      additionalProperties: true
    Node:
      type: object
      required:
        - name
        - type
        - ip
        - auth
        - hardwareInfo
        - softwareInfo
      properties:
        name:
          type: string
          example: node-1
        type:
          type: string
          enum:
            - UE
            - ORU
            - AppServer
        ip:
          type: string
          format: ipv4
        auth:
          $ref: '#/components/schemas/NodeAuth'
        apps:
          type: array
          items:
            $ref: '#/components/schemas/AppStatus'
        hardwareInfo:
          $ref: '#/components/schemas/HardwareInfo'
        softwareInfo:
          $ref: '#/components/schemas/SoftwareInfo'
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserInfo'
          description: List of users assigned to this node (only visible to admins)
        sdrs:
          type: array
          items:
            $ref: '#/components/schemas/SdrInfo'
          description: List of SDRs associated with the node
        ethernetConfig:
          $ref: '#/components/schemas/EthernetConfig'
          description: Ethernet port configuration for ORU or AppServer nodes
    NodeAuth:
      type: object
      description: Authentication mechanism
      discriminator:
        propertyName: authType
        mapping:
