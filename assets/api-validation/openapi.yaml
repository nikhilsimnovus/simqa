      description: Container for JSON import/export of test cases
      required:
        - test_case_details
      properties:
        test_case_details:
          type: array
          items:
            $ref: '#/components/schemas/TestCaseImportItem'
      example:
        test_case_details:
          - Test_Id: import-test_
            Test_Name: import-test
            Test_Description: Imported test case
            State: Active
            Test_Config_Intermediate_Object: {}
    TestCaseImportItem:
      type: object
      description: Single test case definition used by import
