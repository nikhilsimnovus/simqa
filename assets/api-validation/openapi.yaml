                        type: number
                        enum:
                          - 1
                          - 2
                  rfCard:
                    type: number
                    description: Choose the card based on its actual physical connection with the radio head of the base station. If user have upto 4 DL and 4 UL for 1 Cell, rfcard should be 0. If user have upto 4 DL and 4 UL for 2 cells, rfcard will be 0 for cell 1, 2 for cell 2. If user have upto 4 DL and 4 UL for 3 cells, rfcard will be 0 for cell 1, 2 for cell 2, 4 for cell 3.
