    PING:
      type: object
      required:
        - userPlaneConfig
      properties:
        userPlaneConfig:
          type: object
          properties:
            profiles:
              type: array
              items:
                type: object
                required:
                  - startDelay
                  - dataLoop
                  - dataType
                  - packetSize
                  - pdnType
                  - sessionDuration
                  - subscriberGroup
                  - interval
                properties:
                  serverIpAddress:
                    type: string
                    description: Address the UE pings. Required for every direction except downlink, which originates on the app-server and targets the UE itself - there is no destination to supply.
                  startDelay:
                    type: number
                  apnName:
                    type: string
                    nullable: true
                    description: APN this profile runs on. Leave it empty to use the PDN the subscriber already attaches on; naming that same APN is rejected. Two profiles may share an APN, since they can be time exclusive.
                  dataLoop:
                    type: boolean
                  dataType:
                    type: string
                    enum:
                      - no_data
                      - iperf
                      - volte
                      - ftp
                      - ping
                  interval:
                    type: number
                    minimum: 0.002
                    maximum: 3600
                    default: 1
                    description: Seconds between echo requests.
                  packetSize:
                    type: integer
                    minimum: 0
                    maximum: 1444
                    default: 56
                    description: ICMP message size in bytes, header included. The ceiling is 1424 on an ipv6 PDN, where the larger inner header makes GTP-U fragment sooner.
                  numberOfPackets:
                    type: integer
                    minimum: 1
                    default: 600
                  dataDirection:
                    type: string
                    nullable: true
                    description: 'Which end originates the echo request. uplink is the UE pinging serverIpAddress; downlink is network initiated - the app-server pings the UE, so no serverIpAddress is needed. Optional: absent or null means uplink, which is how ping behaved before this field existed.'
                    enum:
                      - uplink
                      - downlink
                      - null
                    default: uplink
                  pdnType:
                    type: string
                  sessionDuration:
                    type: number
                  subscriberGroup:
                    type: array
                    items:
                      type: number
                      description: The subscriber group array can have the value as only -1, where it will be considered as applies to all the subscriber group
