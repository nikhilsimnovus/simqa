            example:
              rfAllocation: device
      responses:
        '200':
          description: Host updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostResponse'
        '400':
          description: Nothing to update, an unknown rfAllocation value, or a regular installation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Cannot change the RF allocation of this host
                error: rfAllocation applies to container installs only
