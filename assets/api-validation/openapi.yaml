        '404':
          description: Simulator not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A simulator with the new name exists already (names are compared ignoring case), or rfCards refused because a test runs on the simulator, a device is not present on the host any more, a device is held by a simulator that is running a test, or the host allocates whole boards and only part of a board was asked for
          content:
