    get:
      summary: Fetch logs for a test execution
      tags:
        - test-executions
        - logs
      operationId: getExecutionLogs
      parameters:
        - in: path
          name: executionId
          required: true
          schema:
            type: string
          description: |
            Unique identifier of the test execution. Can be set to 'current' to refer to the ongoing test execution on a simulator.
        - in: query
          name: simulatorId
          required: false
          schema:
            type: string
          description: |
            Optional simulator identifier. Required if executionId is 'current' and multiple simulators have ongoing tests. Defaults to the default simulator.
        - in: query
          name: ueId
          schema:
            type: integer
          description: Filter by UE identifier
        - in: query
          name: cellId
          schema:
            type: integer
          description: Filter by Cell identifier
        - in: query
          name: layer
          schema:
            type: string
          description: Filter by protocol layer (e.g., PDCP, RRC)
        - in: query
          name: subLayer
          schema:
            type: string
          description: Filter by sub-layer
        - in: query
          name: direction
          schema:
            type: string
            enum:
              - DL
              - UL
            default: DL
          description: Filter by direction. Defaults to DL.
        - in: query
          name: startTime
          schema:
            type: integer
            format: unix
        - in: query
          name: endTime
          schema:
            type: integer
            format: unix
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: uOffset
          schema:
            type: integer
            default: 0
          description: This is optional offset for userplane logs, only valid where those logs are enabled.
      responses:
        '200':
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
