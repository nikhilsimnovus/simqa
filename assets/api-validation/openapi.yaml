        - ram
        - disk
      properties:
        cpuModel:
          type: string
          description: CPU model name
          example: Intel(R) Xeon(R) Gold 6230 CPU @ 2.10GHz
        cpuCores:
          type: integer
          description: Number of CPU cores
          example: 40
        cpuClockSpeed:
          type: string
          description: CPU clock speed
          example: 2.10GHz
        ram:
          type: string
          description: Total RAM size
          example: 128GB
        disk:
          type: string
          description: Total disk space
          example: 1TB
    SoftwareInfo:
      type: object
      required:
        - osVersion
        - kernelVersion
        - baseboard
      properties:
        osVersion:
          type: string
          description: Operating system version
          example: Ubuntu 22.04.3 LTS
        swVersion:
          type: string
          description: Software version
          example: 4.2.1
        kernelVersion:
          type: string
          description: Kernel version
          example: 5.15.0-84-generic
        baseboard:
          type: string
          description: Baseboard or virtualization platform
          enum:
            - Docker
            - KVM
            - Podman
            - Dell
            - HP
            - Asus
          example: Dell
    AppStatus:
      type: object
      required:
        - name
        - cpuPercent
        - memoryMB
      properties:
        name:
          type: string
        cpuPercent:
          type: number
          format: float
        memoryMB:
          type: number
          format: float
    SdrInfo:
      type: object
      required:
        - cardType
        - serialNumber
        - fpgaVersion
        - fpgaTemperature
        - rfTemperature
        - clockSource
        - clockStatus
        - power
        - pcieSlotNumber
      properties:
        cardType:
          type: string
          enum:
            - 100 MHz
            - 50 MHz
          description: Type of the SDR card
          example: 100 MHz
        serialNumber:
          type: string
          description: Serial number of the SDR
          example: '202210001433'
        fpgaVersion:
          type: string
          description: Version of the FPGA firmware
          example: '2024-11-05'
        fpgaTemperature:
          type: number
          description: Temperature of the FPGA in degrees Celsius
          example: 56
        rfTemperature:
          type: number
          description: Temperature of the RF components in degrees Celsius
          example: 56
        clockSource:
          type: string
          enum:
            - external
            - internal
          description: Source of the clock signal
          example: external
        clockStatus:
          type: string
          description: Current status of the clock
          example: locked
        power:
          type: number
          format: float
          description: Power consumption or output level
