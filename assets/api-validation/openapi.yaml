openapi: 3.0.0
info:
  title: Simnovator RESTful API Document.
  description: This document describes the Simnovator RESTful API in details.<br /> Customers can use these APIs to build applications for automation testing.<br /><br />
  version: 3.0.0
servers:
  - url: http://{host}/v2
    variables:
      host:
        default: localhost
        description: Host IP or hostname of the Simnovator server
security:
  - bearerAuth: []
paths:
  /version:
    get:
      summary: Returns version information for Simnovator and its libraries/protocol stacks per simulator
      security:
        - bearerAuth: []
      tags:
        - version
      operationId: getVersion
      parameters:
        - name: simulatorId
          in: query
          description: Optional simulator identifier. If omitted, returns information for all simulators.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Version information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
              examples:
                all:
                  value:
                    simnovator:
                      version: 4.2.1
                      build: 2026-01-22-abcdef
                    simulators:
                      - simulatorId: 1
                        libraries:
                          - name: ue-stack
                            version: '2026-01-22'
                      - simulatorId: 2
                        libraries:
                          - name: ue-stack
                            version: '2026-01-15'
                single:
                  value:
                    simnovator:
                      version: 4.2.1
                      build: 2026-01-22-abcdef
                    simulators:
                      - simulatorId: 1
                        libraries:
                          - name: ue-stack
                            version: '2026-01-22'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /login:
    post:
      summary: Authenticate user and return access token
      description: Authenticates a user via credentials. Returns a JWT access token valid for 3 hours (10,800 seconds). Refresh tokens are not supported. For automated clients or long-running scripts, re-login by calling this endpoint again  upon token expiration is the supported flow.
      tags:
        - authentication
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: johndoe
              password: Password123!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ
                token_type: bearer
                expires_in: 10800
                roles:
                  - admin
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: invalid credentials
        '403':
          description: Password change required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PASSWORD_CHANGE_REQUIRED
                message: password change required
        '500':
          $ref: '#/components/responses/InternalServerError'
  /logout:
    post:
      summary: Invalidate access token (logout)
      tags:
        - authentication
      security:
        - bearerAuth: []
      operationId: logoutUser
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /band-info:
    post:
      summary: Get band information with server-side filtering and sorting
      description: Retrieves 3GPP band information. A POST request is used instead of a GET request because the filtering parameters include complex multi-value arrays (such as mode, geoArea, release, and supportedBandwidth). Using POST with a JSON body avoids query parameter length limitations and parsing issues associated with complex array filters in GET query strings.
      tags:
        - tools
      operationId: getBandInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BandInfoRequest'
            example:
              rat: NR
              search: n7
              mode:
                - FDD
              geoArea:
                - EMEA
              release:
                - '15'
              supportedBandwidth:
                - '5'
                - '10'
                - '20'
              sortBy: band
              sortOrder: asc
      responses:
        '200':
          description: Band information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandInfoResponse'
              example:
                code: 200
                data:
                  - band: n1
                    bandName: n1
                    mode: FDD
                    dlFreqRange:
                      low: 2110
                      centre: 2170
                      high: 2200
                    ulFreqRange:
                      low: 1920
                      centre: 1980
                      high: 1990
                    geoArea: EMEA
                    release: '15'
                    scs:
                      - 15
                      - 30
                    scsBandwidthCombination:
                      - scs: 15
                        bandwidths:
                          - 5
                          - 10
                          - 15
                          - 20
                      - scs: 30
                        bandwidths:
                          - 10
                          - 20
                          - 40
                          - 50
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: Bad Request, RAT must be either 'NR' or 'LTE'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Requested band not found when `band` is provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      summary: Get current authenticated user profile
      tags:
        - user-management
      security:
        - bearerAuth: []
      operationId: getUserProfile
      responses:
        '200':
          description: Current user profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
              example:
                username: johndoe
                first_name: John
                last_name: Doe
                email: john.doe@example.com
                roles:
                  - admin
                last_active: '2026-04-10T09:30:00Z'
                date_created: '2026-01-25T10:00:00Z'
                simulators:
                  - simulatorId: '1'
                    simulatorName: UE-Sim-1
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/update-password:
    post:
      summary: Update user password
      tags:
        - user-management
      security:
        - bearerAuth: []
      operationId: updateUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
            example:
              username: johndoe
              current_password: OldPassword123!
              new_password: NewPassword456!
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ
                token_type: bearer
                expires_in: 10800
                roles:
                  - admin
        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REQUEST
                message: username, current_password, and new_password are required
        '403':
          description: Operation not allowed (e.g., bootstrap admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BOOTSTRAP_ADMIN_PROTECTED
                message: operation not allowed for bootstrap admin user
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users:
    post:
      summary: Create a new user (admin only)
      x-admin-only: true
      description: Creates a new user with optional password. If password is not provided, defaults to "simnovus". User must change password on first login.
      tags:
        - user-management
      security:
        - bearerAuth: []
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              username: janedoe
              first_name: Jane
              last_name: Doe
              email: jane.doe@example.com
              role: user
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  role:
                    type: string
                  message:
                    type: string
              example:
                username: janedoe
                role: user
                message: User created with temporary password. User must change password on first login.
        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REQUEST
                message: username and first_name are required
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: USER_EXISTS
                message: user already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List all users (admin only)
      x-admin-only: true
      tags:
        - user-management
      operationId: getAllUsers
      security:
        - bearerAuth: []
      parameters:
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
          description: Maximum number of items to return per page
        - name: pageNumber
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 1-indexed page number
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserInfo'
                  total:
                    type: integer
                  totalPages:
                    type: integer
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
              example:
                users:
                  - username: johndoe
                    first_name: John
                    last_name: Doe
                    email: john.doe@example.com
                    roles:
                      - admin
                    last_active: '2026-04-10T09:30:00Z'
                    date_created: '2026-01-25T10:00:00Z'
                    simulators: []
                  - username: janedoe
                    first_name: Jane
                    last_name: Doe
                    email: jane.doe@example.com
                    roles:
                      - user
                    last_active: '2026-04-10T08:15:00Z'
                    date_created: '2026-02-10T11:00:00Z'
                    simulators:
                      - simulatorId: '2'
                        simulatorName: ORU-Sim-1
                total: 2
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/search:
    post:
      summary: Search and filter users with advanced capabilities (admin only)
      x-admin-only: true
      description: Search users with optional filtering, sorting, and pagination. Supports complex filters with AND/OR conditions.
      tags:
        - user-management
      operationId: findUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchUsersRequest'
            examples:
              simple:
                value:
                  filter: {}
                  pageNumber: 1
                  pageSize: 20
                  sort_parameter: username
                  sort_order: ASC
              username_filter:
                value:
                  filter:
                    field: username
                    operator: contains
                    value: admin
                  pageNumber: 1
                  pageSize: 20
                  sort_parameter: username
                  sort_order: ASC
              role_filter:
                value:
                  filter:
                    field: roles
                    operator: '='
                    value: admin
                  pageNumber: 1
                  pageSize: 50
                  sort_parameter: lastName
                  sort_order: DESC
              complex_filter:
                value:
                  filter:
                    op: AND
                    conditions:
                      - field: username
                        operator: contains
                        value: admin
                      - field: roles
                        operator: '='
                        value: admin
                  pageNumber: 1
                  pageSize: 20
                  sort_parameter: firstName
                  sort_order: ASC
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchUsersResponse'
              example:
                users:
                  - username: johndoe
                    first_name: John
                    last_name: Doe
                    email: john.doe@example.com
                    roles:
                      - admin
                    last_active: '2026-04-10T09:30:00Z'
                    date_created: '2026-01-25T10:00:00Z'
                    simulators: []
                total: 45
                total_pages: 3
                page_info:
                  page: 1
                  total_items: 20
                message: Successfully retrieved users
        '400':
          description: Invalid filter or pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_FILTER
                message: invalid filter format
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{username}/reset-password:
    post:
      summary: Reset user password to temporary value (admin only)
      description: Resets a user's password to a temporary value. If new_password is not provided, defaults to "simnovus". User must change password on next login.
      x-admin-only: true
      tags:
        - user-management
      operationId: resetUserPassword
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: Username of the user
          example: janedoe
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              new_password: TempPassword789!
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Password reset. User must change it on next login.
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REQUEST
                message: new_password is required
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (cannot reset bootstrap admin password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BOOTSTRAP_ADMIN_PROTECTED
                message: operation not allowed for bootstrap admin user
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: USER_NOT_FOUND
                message: user not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{username}:
    delete:
      summary: Delete a user (admin only)
      x-admin-only: true
      tags:
        - user-management
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: Username of the user to delete
          example: janedoe
      responses:
        '200':
          description: User deleted; their data is removed by the returned DELETE_USER_RESOURCES job
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
              example:
                jobId: 3f1c2a9e-7b4d-4e61-9a8f-0c2d5e6b7a10
        '400':
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REQUEST
                message: user id is required
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (cannot delete self or an admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SELF_DELETION_NOT_ALLOWED
                message: cannot delete your own account
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: USER_NOT_FOUND
                message: user not found
        '409':
          description: The user has a test running or stopping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: USER_HAS_RUNNING_TEST
                message: user has a test in progress
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          description: The executor did not answer; the cleanup job may or may not have been queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DELETE_RESULT_UNKNOWN
                message: 'delete result unknown: the executor did not answer; check the DELETE_USER_RESOURCES job before retrying'
    patch:
      summary: Update user profile
      tags:
        - user-management
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: Username of the user to update
          example: johndoe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              first_name: John
              last_name: Doe
              email: john.doe@example.com
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
              example:
                username: johndoe
                first_name: John
                last_name: Doe
                email: john.doe@example.com
                roles:
                  - user
        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REQUEST
                message: at least one field (first_name, last_name, email) must be provided
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden (users can only update their own profile)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: users can only update their own profile
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: USER_NOT_FOUND
                message: user not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /simulators:
    get:
      summary: List all simulators with optional filters
      tags:
        - simulators
      operationId: getAllSimulators
      parameters:
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
          description: Maximum number of items to return per page
        - name: pageNumber
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 1-indexed page number
      responses:
        '200':
          description: Filtered simulator list
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - totalPages
                  - pageInfo
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Simulator'
                  total:
                    type: integer
                  totalPages:
                    type: integer
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a new simulator (admin only)
      description: Creates a new simulator with the specified configuration. Type field accepts "ORU" or "UE"; defaults to "UE" if not provided. Required fields are simulatorName and ipAddress. A Simnovator is installed in one mode (regular or container); a simulatorMode naming the other mode is refused. A container UE simulator holds the RF cards named in rfCards (each present and free; a whole board when the host allocates per board), or, when rfCards is left out, the first free RF board (or device, depending on the host); when none is free it is not created.
      tags:
        - simulators
      operationId: createSimulator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSimulatorRequest'
            example:
              simulatorName: UE-Sim-1
              ipAddress: 192.168.1.64
              type: UE
      responses:
        '201':
          description: Simulator created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Simulator created successfully
                data:
                  id: '1'
                  name: UE-Sim-1
                  type: UE
                  status:
                    availability: AVAILABLE
                    connectivity: CONNECTED
                    stability: STABLE
                  lastUpdated: '2026-01-25T09:30:00Z'
                  createdDate: '2026-01-25T09:30:00Z'
                  nodes:
                    ipaddress: 192.168.1.64
                    assignedUsers: []
                    ueSimPort: 9001
                    appManagerPort: 8081
                    simulatorMode: container
                    hostId: 4
                    slot: 2
                    rfCards:
                      - 0
                      - 1
                    rfCardsAbsent: []
        '400':
          description: Invalid request, missing required fields (simulatorName, ipAddress), invalid simulator type, a simulatorMode that is not what the box runs, an ORU asked for as a container, an empty rfCards, rfCards that are not consecutive, or rfCards on a simulator that is not a container UE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Cannot create simulator on this host
                error: the box at 192.168.1.64 runs in container mode
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: A simulator with that name exists already (names are compared ignoring case), or the simulator cannot be placed on the host - no UE box agent is connected on that address, no RF board (or device) on the host is free for a UE simulator, or a card named in rfCards is held by a simulator that is running a test, absent, or half of a board on a host that allocates whole boards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Cannot create simulator on this host
                error: no free RF board on host 192.168.1.64
        '500':
          $ref: '#/components/responses/InternalServerError'
  /simulators/{simulatorId}:
    patch:
      summary: Update an existing simulator (admin only)
      description: Updates simulator configuration. Type field accepts "ORU" or "UE" only. All fields are optional. rfCards replaces the RF devices a container UE simulator holds; it is refused while a test runs on the simulator or when a device is not on the host, not present any more, or held by another simulator.
      tags:
        - simulators
      operationId: updateSimulator
      parameters:
        - in: path
          name: simulatorId
          required: true
          schema:
            type: string
          description: Simulator ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSimulatorRequest'
            example:
              simulatorName: Updated-Simulator-Name
              rfCards:
                - 2
                - 3
      responses:
        '200':
          description: Simulator updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Simulator updated successfully
                data:
                  id: '1'
                  name: UE-Sim-1
                  type: UE
                  status:
                    availability: AVAILABLE
                    connectivity: CONNECTED
