          example: -12.345
        latency:
          type: number
          format: float
          description: Latency in milliseconds
          example: 256.19
        satSpeed:
          type: number
          format: float
          description: Satellite speed in km/s
          example: 7.65
        taUE:
          type: number
          format: float
          description: Timing advance for UE in microseconds
          example: 128.1
        taCommon:
          type: number
          format: float
          description: Common timing advance in microseconds
          example: 128.05
        rtt:
          type: number
          format: float
          description: Round trip time in milliseconds
          example: 512.38
    NetworkTopologyDiagramInput:
      type: object
      description: Fields accepted when creating or updating a topology diagram
      required:
        - name
        - content
      properties:
        name:
          type: string
          maxLength: 100
          description: Unique name for the diagram
          example: Default Topology
        content:
          type: string
          description: Mermaid source for the diagram
          example: |
            graph LR
                UPF[UPF Node] --- gNB[gNodeB Base Station]
                gNB --- UE[User Equipment]
        viewers:
          type: array
          description: |
            Keycloak user ids allowed to view this diagram. A single "*" entry shares it with every user; an empty array restricts it to administrators. Omit the field to leave existing grants unchanged.
          items:
            type: string
          example:
            - '*'
    NetworkTopologyDiagram:
      type: object
      description: A stored network topology diagram
      required:
        - id
        - name
        - content
        - viewers
        - userId
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          maxLength: 100
          example: Default Topology
        content:
          type: string
          description: Mermaid source for the diagram
          example: |
            graph LR
                UPF[UPF Node] --- gNB[gNodeB Base Station]
                gNB --- UE[User Equipment]
        viewers:
          type: array
          description: |
            Keycloak user ids allowed to view this diagram; a single "*" entry means every user, and an empty array means administrators only.
          items:
            type: string
          example:
            - '*'
        userId:
          type: string
          description: |
            Keycloak id of the administrator who authored the diagram. The diagram seeded with the deployment reports "system". Recorded for audit only; it does not affect who can view the diagram.
          example: system
        createdAt:
          type: string
          format: date-time
          example: '2026-07-19T10:13:58.376901Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-07-19T10:14:51.110828Z'
