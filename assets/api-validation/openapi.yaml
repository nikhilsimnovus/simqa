        - test-executions
      operationId: startTestExecution
      parameters:
        - in: path
          name: testCaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTestExecutionRequest'
      responses:
        '200':
          description: Test case execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseAPIResponse'
              example:
                status: success
                message: Test case started successfully
                executionId: 019e62d1-e1f9-70d9-b18e-665678aeba9f
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Test case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Simulator is busy with another test execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CONFLICT
                message: 'Cannot start test case. Simulator already has an in-progress test: SA'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_SERVER_ERROR
