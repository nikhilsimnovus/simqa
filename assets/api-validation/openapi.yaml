          description: True if this log profile is a system generated log profile
          example: true
        layers:
          $ref: '#/components/schemas/LogLayers'
        savePhySignals:
          type: boolean
          description: Flag to save physical layer signals
          example: false
        displayEncryptedPayload:
          type: boolean
          description: Flag to display encrypted payload
          example: false
        displaySecurityKey:
          type: boolean
          description: Flag to display security key
          example: false
        enableNTN:
          type: boolean
          description: Flag to enable NTN logs
          example: false
    LogLevel:
      type: string
      enum:
        - NONE
        - ERROR
        - INFO
        - DEBUG
    BaseLayerLogConfig:
      type: object
      required:
        - level
      properties:
        level:
          $ref: '#/components/schemas/LogLevel'
    NasRrcBaseLogConfig:
      allOf:
        - $ref: '#/components/schemas/BaseLayerLogConfig'
    NasLogConfig:
      allOf:
        - $ref: '#/components/schemas/NasRrcBaseLogConfig'
    RrcLogConfig:
      allOf:
        - $ref: '#/components/schemas/NasRrcBaseLogConfig'
    PhyLogConfig:
      allOf:
        - $ref: '#/components/schemas/BaseLayerLogConfig'
    Simnovator:
