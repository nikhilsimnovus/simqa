                  duplexMode:
                    type: string
                    enum:
                      - FDD
                      - TDD
                  band:
                    type: string
                  bandwidth:
                    type: string
                    description: Choose the bandwidth as configured at the base station.
                  EARFCN:
                    type: object
                    required:
                      - dl
                      - ul
                    properties:
                      dl:
                        type: number
                      ul:
                        type: number
                  prach:
                    type: number
                    description: To simulate an arbitrary PRACH timing advance, add a delay relative to the other uplink signals in TA units.
