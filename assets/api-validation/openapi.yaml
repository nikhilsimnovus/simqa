  /api/jobs/{id}:
    get:
      summary: Get the status and details of a specific async job
      description: |
        Returns the current state of a background job (e.g. a DELETE_TESTCASE cleanup job) by its UUID. Use the jobId returned from any API that responds with HTTP 202 Accepted.
      tags:
        - jobs
      operationId: getJobById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the job to look up
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: Job details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: job fetched
                  data:
                    $ref: '#/components/schemas/Job'
              example:
                success: true
                message: job fetched
                data:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  type: DELETE_TESTCASE
                  status: success
                  stage: logs_cleaned
                  progress: 100
                  message: cleanup complete
                  error: ''
                  retry_count: 0
                  created_at: '2026-05-12T10:00:00Z'
                  updated_at: '2026-05-12T10:01:30Z'
                  started_at: '2026-05-12T10:00:05Z'
                  completed_at: '2026-05-12T10:01:30Z'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Job not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/jobs:
    get:
      summary: List all async jobs with optional filtering
      description: |
        Returns a paginated list of background jobs. Optionally filter by status. Jobs are automatically purged after 5 days of completion.
      tags:
        - jobs
      operationId: listJobs
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - pending
              - running
              - success
              - failed
          description: Filter jobs by status
          example: running
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Maximum number of jobs to return
          example: 50
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of jobs to skip (for pagination)
          example: 0
      responses:
        '200':
          description: Job list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
