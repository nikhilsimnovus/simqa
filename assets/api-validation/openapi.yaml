          type: array
          items:
            $ref: '#/components/schemas/EthernetPort'
    TestCase:
      type: object
      required:
        - id
        - name
        - testDefinition
      properties:
        id:
          type: string
          format: uuid
          description: Unique test case identifier represented as a time-sorted UUIDv7.
          example: 018f9c1a-2b3c-7d4e-af56-123456789abc
        name:
          type: string
          description: Human-readable test case name
          example: NR UE Attach Test
        description:
          type: string
          description: Detailed description of the test case
          example: Verifies the initial attach procedure for a 5G NR UE.
        metadata:
          $ref: '#/components/schemas/TestCaseMetadata'
        status:
          type: string
          description: Final execution status of the test case
          example: Not Executed
        validationStatus:
          type: array
          description: Validation results per page
          items:
            type: object
            properties:
              pass:
                type: boolean
              errors:
                type: string
    TestCaseMetadata:
      type: object
      properties:
        createdOn:
          type: string
          format: date-time
        lastModifiedOn:
          type: string
          format: date-time
        lastExecutedOn:
          type: string
          format: date-time
          nullable: true
        lastExecution:
          allOf:
            - $ref: '#/components/schemas/TestExecutionResult'
          nullable: true
        executionHistory:
          type: array
          description: List of all previous execution results (most recent first)
          items:
            $ref: '#/components/schemas/ExecutionHistoryItem'
        user_tags:
          type: array
          description: List of tags created by the user to categorize test cases for their specific use cases.
          items:
            type: string
          example:
            - trial
        system_tags:
          type: array
          description: List of tags reserved for system categorization and internal use. For example, a test case with the system tag 'gui' indicates it was created via the GUI, whereas the absence of this tag indicates it was created directly via the API.
          items:
            type: string
          example:
            - sample
    TestLicenseMetadata:
      type: object
      description: License requirements to execute this test
