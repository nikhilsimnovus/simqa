    post:
      summary: Export one or more test cases as a compressed file or JSON
      tags:
        - test-cases
      operationId: exportTestCases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - testCaseIds
              properties:
                testCaseIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: List of test case identifiers to export
                output:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - json
                        - zip
                        - tar.gz
                        - tar
                      default: json
                      description: Desired output format
                    fileName:
                      type: string
                      description: Name of the exported file
      responses:
        '200':
          description: Test cases exported successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
