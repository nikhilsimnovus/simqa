        '404':
          description: Host not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Switching to board while a board is split between two simulators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Cannot change the RF allocation of this host
                error: sdr0, sdr1 are one board but not held by one simulator; free or reassign them first
    delete:
      summary: Remove a host that is gone (admin only)
      description: Removes the host, its RF cards and its machine record. Refused while the box's agent is connected or a simulator is on the host.
