components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    testCaseId:
      name: testCaseId
      in: path
      description: The unique UUID of the test case.
      required: true
      schema:
        type: string
        format: uuid
  responses:
    CellCreationSuccessResponse:
      description: Test case initialized and cells created successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CellCreationSuccess'
    SuccessResponse:
      description: Operation completed successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessApiResponse'
    BadRequest:
      description: Invalid input or request payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
          example:
            success: false
            message: Please provide valid parameters or payload.
    UnauthorizedError:
      description: Authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication token is missing or invalid
            details: {}
    NotFound:
      description: The specified test case ID was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
          example:
            success: false
            message: No test case found with the provided ID.
    ForbiddenError:
      description: User does not have permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: User does not have permission to perform this action
            details: {}
    Conflict:
      description: Resource conflict or test case already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
          example:
            success: false
            message: A test case resource conflict occurred.
    InternalServerError:
      description: An unexpected error occurred on the server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: An unexpected error occurred on the server
            details: {}
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code for programmatic handling
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
        executionId:
          type: string
          description: Unique identifier of the test execution/iteration (primarily present on start/restart failures)
    MetricWithChange:
      type: object
      required:
        - value
        - change
      properties:
        value:
          type: number
          format: float
          description: The metric value
          example: 85.5
        change:
          type: number
          format: float
          description: Change in the metric (delta)
          example: 2.3
    LastTestInfo:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: Name of the last test executed
          example: Test Case 1
        status:
          type: string
          description: Status of the last test (e.g., PASSED, FAILED)
          example: PASSED
    DashboardCards:
      type: object
      required:
        - successRate
        - failureRate
        - totalTests
        - activeTests
        - lastTest
      properties:
        successRate:
          $ref: '#/components/schemas/MetricWithChange'
        failureRate:
          $ref: '#/components/schemas/MetricWithChange'
        totalTests:
          type: object
          required:
            - value
            - change
          properties:
            value:
              type: integer
              description: Total number of tests
              example: 42
            change:
              type: integer
              description: Change in total tests
              example: 5
        activeTests:
          type: integer
          description: Number of currently active tests
          example: 3
        lastTest:
          $ref: '#/components/schemas/LastTestInfo'
    TrendPoint:
      type: object
      required:
        - date
        - created
        - executed
        - edited
      properties:
        date:
          type: string
          description: Date of the trend point
          example: '2026-08-03'
        created:
          type: integer
          description: Number of tests created on this date
          example: 5
        executed:
          type: integer
          description: Number of tests executed on this date
          example: 12
        edited:
          type: integer
          description: Number of tests edited on this date
          example: 2
    ActivityRow:
      type: object
      required:
        - action
        - testName
        - timeAgo
      properties:
        action:
          type: string
          description: The action performed (e.g., CREATED, EXECUTED, UPDATED)
          example: EXECUTED
        testName:
          type: string
          description: Name of the test case
          example: Test Case 1
        status:
          type: string
          description: Status of the action (optional)
          example: PASSED
        duration:
          type: string
          description: Duration of the test execution (optional)
          example: 125.6 seconds
        timeAgo:
          type: string
          description: Relative time when the action occurred
          example: 2 hours ago
    DashboardMetricsResponse:
      type: object
      required:
        - cards
        - trends
        - recentActivities
      properties:
        cards:
          $ref: '#/components/schemas/DashboardCards'
        trends:
          type: array
          description: Activity trends over time
          items:
            $ref: '#/components/schemas/TrendPoint'
        recentActivities:
          type: array
          description: Recent activities
          items:
            $ref: '#/components/schemas/ActivityRow'
    TestCaseImportPack:
