                executionId: 019e62fa-3c9c-7cdb-9f25-06f429c69faf
  /testcases/executions/{executionId}/stop:
    post:
      summary: Stop a running test execution
      description: |
        Stops a specific test execution. Can use 'current' as executionId to refer to the ongoing test execution on a simulator.
      tags:
        - test-executions
      operationId: stopTestExecution
      parameters:
        - in: path
          name: executionId
          required: true
          schema:
            type: string
          description: |
            Unique identifier of the test execution. Can be set to 'current' to refer to the ongoing test execution on a simulator.
        - in: query
          name: simulatorId
          required: false
          schema:
            type: string
          description: |
            Optional simulator identifier. Required if executionId is 'current'.
      responses:
        '200':
          description: Test execution stopped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseAPIResponse'
              example:
                status: Success
                message: Test case stopped successfully
        '400':
          description: Bad Request - Execution is not in a stoppable state or simulator not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: 'Execution is not in a stoppable state (current status: Aborted)'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /testcases/executions/{executionId}/restart:
    post:
      summary: Restart a test execution
      description: |
        Restarts a test execution by stopping the current one (if running) and starting a new execution. Can use 'current' as executionId.
      tags:
        - test-executions
      operationId: restartTestExecution
      parameters:
        - in: path
          name: executionId
          required: true
          schema:
            type: string
          description: |
            Unique identifier of the test execution to restart. Can be set to 'current' to refer to the ongoing test execution on a simulator.
        - in: query
          name: simulatorId
          required: false
          schema:
            type: string
          description: |
            Optional simulator identifier. Required if executionId is 'current'.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                simulatorId:
                  type: string
                  description: Optional simulator override for restart
      responses:
        '200':
          description: Test execution restarted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseAPIResponse'
        '400':
          description: Bad Request - Invalid request or simulator not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: Execution not found
                details: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
